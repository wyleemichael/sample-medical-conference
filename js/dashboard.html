<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · HKIMC 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;650&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <header class="page-hero"><div class="wrap">
    <p class="kicker" style="color:var(--gold)">Dashboard</p>
    <h1 id="dash-name">Delegate</h1>
    <p id="dash-meta" class="muted"></p>
  </div></header>
  <main class="section">
    <div class="wrap dash-grid">
      <div>
        <article class="dash-card" id="reg-status"></article>
        <article class="dash-card" style="margin-top:16px">
          <h3>Your abstracts</h3>
          <div id="abs-status"></div>
        </article>
      </div>
      <aside>
        <article class="dash-card">
          <h3>Highlighted sessions</h3>
          <ul id="upcoming"></ul>
          <p><a href="programme.html">Full programme</a></p>
        </article>
        <article class="dash-card" style="margin-top:16px">
          <h3>Account</h3>
          <button class="btn btn-ghost" id="logout" type="button">Log out</button>
        </article>
      </aside>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script>initPage("dashboard");</script>
</body>
</html>
